<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quanto custa um cliente que não volta? · Treinamento para donos de loja</title>
<meta name="description" content="Treinamento gratuito de poucos minutos para o dono da loja: por que treinar a equipe sai mais barato do que perder clientes e vendas.">
<meta property="og:type" content="website">
<meta property="og:title" content="Quanto custa um cliente que não volta?">
<meta property="og:description" content="Treinamento gratuito para donos de loja, em poucos minutos: treinar a equipe sai mais barato do que perder clientes e vendas.">
<meta property="og:image" content="https://cliente-assistido.vercel.app/treinamento-loja/dono-da-loja/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://cliente-assistido.vercel.app/treinamento-loja/dono-da-loja">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B2545">
<link rel="icon" href="/icon-192.png">
<style>
:root{--bg:#f3f5f4;--card:#fff;--tx:#14201b;--mut:#5f6b65;--line:#e1e7e4;--g:#12B76A;--g2:#0A8F52;--n:#0B2545;--o:#FF8A00;--r:#E5484D;--ok:#e6f6ee;--leg:#0B2545;--warn:#fff4e5;--bad:#fdecec}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1513;--card:#18201d;--tx:#e9efec;--mut:#9aa6a0;--line:#2a3430;--ok:#173326;--g2:#3cbf84;--leg:#22344f;--warn:#3a2a12;--bad:#3a1c1c}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--g2)}
.top{background:var(--n);color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.brand{display:flex;gap:10px;align-items:center;max-width:760px;margin:auto}
.brand img{width:38px;height:38px;border-radius:10px}
.brand b{display:block;font-size:17px;line-height:1.1}.brand b span{color:var(--g)}
.brand i{font-style:normal;font-size:13px;opacity:.85}
main{max-width:760px;margin:auto;padding:16px 16px 40px}
.hero{background:linear-gradient(140deg,#0B2545 0%,#0d3a4a 55%,#0A8F52 130%);color:#fff;border-radius:20px;padding:26px 20px 22px;position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-70px;top:-70px;width:190px;height:190px;border-radius:50%;background:rgba(255,138,0,.16);pointer-events:none}
.hero>*{position:relative;z-index:1}
.selo{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;letter-spacing:.02em}
.hero h1{margin:12px 0 10px;font-size:clamp(27px,7vw,38px);line-height:1.12;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:#FFB24D}
.hero p{margin:0 0 18px;font-size:17px;opacity:.95;max-width:560px}
.hero .quem{font-size:14px;opacity:.85;margin:14px 0 0}
button,.btn{font:inherit;font-weight:700;border-radius:14px;padding:12px 18px;border:2px solid var(--g2);background:var(--card);color:var(--g2);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;-webkit-tap-highlight-color:transparent}
.btn.pri,button.pri{background:var(--g2);color:#fff}
.btn.lar{background:var(--o);border-color:var(--o);color:#1b1206}
.bloq{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:16px 0}
.card h2{margin:0 0 4px;font-size:20px;line-height:1.25}
.card .sub{margin:0 0 12px;color:var(--mut);font-size:15px}
.palco{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#F3F8F5;aspect-ratio:16/10}
.palco svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .6s ease}
.palco svg.on{opacity:1}
.navT{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px}
.navT button{min-height:38px;width:42px;padding:0;border-radius:50%;font-size:18px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--g2)}
.leg{min-height:84px;margin:10px 0 0;padding:12px 14px;border-radius:12px;background:var(--leg);color:#fff;font-size:16px;line-height:1.45;text-align:center;display:flex;align-items:center;justify-content:center}
.acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.dica{display:none;margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn);border:1px solid #FF8A00;font-size:14px;text-align:center}
.dica.on{display:block}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.num{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px}
.num b{display:block;font-size:26px;line-height:1.1;color:var(--o)}
.num span{display:block;font-size:14px;margin-top:4px}
.num small{display:block;color:var(--mut);font-size:12px;margin-top:6px}
.num small a{color:var(--mut)}
@media(max-width:560px){.nums{grid-template-columns:1fr}.num{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;align-items:center}.num b{grid-row:span 2}.num span{margin:0}.num small{margin:0}}
.video{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:16/9}
.video img,.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.video .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 40%,rgba(0,0,0,.55));border:0;border-radius:0;color:#fff;width:100%;height:100%}
.video .play span{width:72px;height:72px;border-radius:50%;background:rgba(229,72,77,.95);display:grid;place-items:center;font-size:30px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.video .trava{position:absolute;inset:0;background:rgba(11,37,69,.78);color:#fff;display:none;place-items:center;text-align:center;padding:16px;font-weight:600;z-index:2;cursor:not-allowed}
.video.travado .trava{display:grid}
.vidInfo{font-size:14px;color:var(--mut);margin:8px 2px 0}
.dlgPalco{border-radius:14px;overflow:hidden;border:1px solid var(--line)}.dlgPalco svg{display:block;width:100%;height:auto}
.dlgBalao{min-height:66px;margin:0 0 10px;padding:10px 12px;border-radius:14px;background:var(--ok);font-size:16px;line-height:1.4;position:relative}
.dlgBalao.falaa{background:#e3f5ea;border:2px solid #0A8F52;color:#0d3b24}.dlgBalao.falac{background:#e4eefa;border:2px solid #2f6fb3;color:#12355e;text-align:right}
.dlgBalao.falan{background:#fff4e5;border:2px solid #FF8A00;color:#5c3300}
.dlgBalao.falaa:after,.dlgBalao.falac:after{content:'';position:absolute;bottom:-9px;width:16px;height:16px;transform:rotate(45deg);background:inherit;border:inherit;border-top:0;border-left:0}
.dlgBalao.falaa:after{left:22%}.dlgBalao.falac:after{right:22%}
@media(prefers-color-scheme:dark){.dlgBalao.falaa{background:#173326;color:#dff5e8}.dlgBalao.falac{background:#16263a;color:#dbe9f8}.dlgBalao.falan,.rende li.on{background:#3a2a12;color:#ffcf8a}}
.dlgP .bocaA{display:none}.dlgP.falando .boca{display:none}.dlgP.falando .bocaA{display:block;transform-box:fill-box;transform-origin:center;animation:boca .22s ease-in-out infinite alternate}
.dlgP.falando{filter:drop-shadow(0 0 6px rgba(255,138,0,.9))}
@keyframes boca{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.rende{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--ok);font-size:15px}
.rende ul{margin:6px 0 0;padding-left:20px}.rende li{padding:2px 4px}
.rende.lendo{outline:2px solid #FF8A00}.rende li.on{background:#fff4e5;border-radius:6px;font-weight:600}
.ler h3{font-size:19px;line-height:1.3;margin:18px 0 6px}
.ler h3:first-of-type{margin-top:6px}
.ler p{margin:0 0 10px}
.destaque{background:var(--warn);border-left:5px solid var(--o);border-radius:12px;padding:12px 14px;margin:12px 0;font-weight:600}
.conta{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.conta label{display:block;font-size:15px;margin:0 0 10px}
.conta input{display:block;width:100%;margin-top:4px;font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.res{border-radius:12px;background:var(--bad);border:1px solid #f3b3b3;padding:12px 14px;text-align:center}
.res b{display:block;font-size:30px;line-height:1.15;color:var(--r)}
.res small{display:block;color:var(--mut);font-size:13px;margin-top:6px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.vs div{border-radius:14px;padding:12px 14px;font-size:15px}
.vs .sem{background:var(--bad);border:1px solid #f3b3b3}.vs .com{background:var(--ok);border:1px solid #9fd8b8}
.vs h4{margin:0 0 6px;font-size:16px}.vs ul{margin:0;padding-left:18px}
@media(max-width:480px){.vs{grid-template-columns:1fr}}
.licoes{counter-reset:l;list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.licoes li{counter-increment:l;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 46px;position:relative;font-weight:600;font-size:15px}
.licoes li:before{content:counter(l);position:absolute;left:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font-size:13px}
@media(max-width:480px){.licoes{grid-template-columns:1fr}}
.check{list-style:none;padding:0;margin:8px 0 0}.check li{padding:5px 0 5px 30px;position:relative}.check li:before{content:'✓';position:absolute;left:4px;top:4px;color:var(--g2);font-weight:800}
.cta{background:var(--n);color:#fff;border-radius:20px;padding:24px 18px;margin-top:18px;text-align:center;scroll-margin-top:12px}
.cta h2{margin:0 0 8px;font-size:clamp(22px,6vw,28px);line-height:1.2}
.cta p{margin:0 auto 16px;opacity:.92;max-width:520px}
.cta .bts{display:grid;gap:10px;max-width:440px;margin:auto}
.cta .btn{width:100%;border-color:var(--g);background:var(--g);color:#06301c}
.cta .btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.cta .zap{font-size:14px;opacity:.85;margin:14px 0 0}.cta .zap span{white-space:nowrap}
.fontes{font-size:12px;color:var(--mut);margin-top:22px}
.fontes ol{padding-left:18px;margin:6px 0}
.rod{text-align:center;font-size:13px;color:var(--mut);margin-top:18px}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.palco svg{transition:none}.dlgP.falando .bocaA{animation:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><img src="/icon-192.png" alt=""><div><b>Cliente <span>Assistido</span></b><i>Treinamento para donos de loja</i></div></div></header>
<main id="app"></main>
<script src="/treinamento-loja/dono-da-loja/dono.js"></script>
</body>
</html>
